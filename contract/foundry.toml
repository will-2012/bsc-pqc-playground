[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.23"
evm_version = "paris"
optimizer = true
optimizer_runs = 1000000
bytecode_hash = "none"
remappings = [
    "@account-abstraction/=node_modules/@account-abstraction/",
    "@openzeppelin/=node_modules/@openzeppelin/"
]
